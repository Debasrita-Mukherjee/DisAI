<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Myntra Clone</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body>

  <!-- Navbar -->

  <header>

    <div class="logo">
      <h2>Myntra</h2>
    </div>

    <nav>

      <ul>
        <li>Men</li>
        <li>Women</li>
        <li>Kids</li>
        <li>Home</li>
        <li>Beauty</li>
        <li>Studio</li>
      </ul>

    </nav>

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input type="text" placeholder="Search for products, brands and more">

    </div>

    <div class="icons">

      <div>
        <i class="fa-regular fa-user"></i>
        <p>Profile</p>
      </div>

      <div>
        <i class="fa-regular fa-heart"></i>
        <p>Wishlist</p>
      </div>

      <div>
        <i class="fa-solid fa-bag-shopping"></i>
        <p>Bag</p>
      </div>

    </div>

  </header>

  <!-- Banner -->

  <section class="banner">

    <img
      src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1400&auto=format&fit=crop"
      alt="banner"
    >

  </section>

  <!-- Categories -->

  <section class="categories">

    <h2>SHOP BY CATEGORY</h2>

    <div class="category-container">

      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=800&auto=format&fit=crop">
        <h3>Men</h3>
      </div>

      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=800&auto=format&fit=crop">
        <h3>Women</h3>
      </div>

      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&auto=format&fit=crop">
        <h3>Kids</h3>
      </div>

      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?q=80&w=800&auto=format&fit=crop">
        <h3>Beauty</h3>
      </div>

    </div>

  </section>

  <!-- Products -->

  <section class="products">

    <h2>TRENDING PRODUCTS</h2>

    <div class="product-container">

      <div class="product-card">

        <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=800&auto=format&fit=crop">

        <h3>Casual T-Shirt</h3>

        <p>₹799</p>

        <button>Add to Bag</button>

      </div>

      <div class="product-card">

        <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=800&auto=format&fit=crop">

        <h3>Stylish Jacket</h3>

        <p>₹1999</p>

        <button>Add to Bag</button>

      </div>

      <div class="product-card">

        <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=800&auto=format&fit=crop">

        <h3>Women Dress</h3>

        <p>₹1499</p>

        <button>Add to Bag</button>

      </div>

      <div class="product-card">

        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=800&auto=format&fit=crop">

        <h3>Kids Fashion</h3>

        <p>₹999</p>

        <button>Add to Bag</button>

      </div>

    </div>

  </section>

  <!-- Footer -->

  <footer>

    <p>© 2026 Myntra Clone | Frontend Project</p>

  </footer>

  <script src="script.js"></script>

</body>
</html>
